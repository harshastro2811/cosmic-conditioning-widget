<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic Conditioning Widget</title>
    <style>
      :root {
        --bg1: #fffaf5;
        --bg2: #f7ebdc;
        --card: #fdf3e5;
        --ink: #2a1b14;
        --muted: #6a4b3d;
        --gold: #c86a21;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, var(--bg1), var(--bg2));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
      }
      .card {
        width: min(90vw, 520px);
        background: var(--card);
        border-radius: 22px;
        box-shadow: 0 18px 45px rgba(66, 36, 18, 0.12);
        padding: 28px 22px 24px;
        text-align: center;
        border: 1px solid rgba(85, 61, 45, 0.1);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(26px, 5vw, 42px);
        letter-spacing: 0.04em;
        color: var(--gold);
      }
      p {
        margin: 0 0 20px;
        font-size: 18px;
        line-height: 1.6;
        color: var(--muted);
      }
      .install-btn {
        display: inline-block;
        text-decoration: none;
        background: linear-gradient(180deg, #f8a65c, #db6a17);
        color: white;
        padding: 18px 26px;
        border-radius: 16px;
        font-weight: 700;
        font-size: 18px;
        box-shadow: 0 10px 20px rgba(200, 106, 33, 0.25);
      }
      .small {
        margin-top: 16px;
        font-size: 13px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Cosmic Conditioning</h1>
      <p>Tap below to install the Scriptable widget directly into your iPhone.</p>
      <a
        class="install-btn"
        href="scriptable:///import?url=https%3A%2F%2Fraw.githubusercontent.com%2Fharshastro2811%2Fcosmic-conditioning-widget%2Fmain%2FCosmicConditioning.js"
      >Install Widget</a>
      <div class="small">Open this page on Safari on your iPhone, then tap Install Widget.</div>
    </div>
  </body>
</html>
